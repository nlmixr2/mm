# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
#
# See https://github.com/r-lib/actions/tree/master/examples#readme for
# additional example workflows available for the R community.

name: R

on:
  push:
    branches: [ "main" ]
  # PR checks run only when a reviewer approves with the phrase
  # "ready to be merged" (pushes to a PR branch no longer start CI).
  pull_request_review:
    types: [submitted]
  # Maintainers can also start PR checks by commenting "/ci" on the PR.
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  build:
    if: ((github.event_name != 'pull_request_review' && github.event_name != 'issue_comment') || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && contains(github.event.review.body, 'ready to be merged') && contains(fromJSON('["main"]'), github.event.pull_request.base.ref)) || (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/ci') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    # statuses: write lets a /ci run report back to the PR
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    runs-on: macos-latest
    strategy:
      matrix:
        r-version: ['3.6.3', '4.1.1']

    steps:
      - name: Report /ci run to the PR (pending)
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        env:
          CI_CONTEXT: build (${{ join(matrix.*, ', ') }})
        with:
          script: |
            const pr = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
            core.exportVariable('CI_PR_HEAD_SHA', pr.data.head.sha);
            await github.rest.repos.createCommitStatus({ ...context.repo, sha: pr.data.head.sha,
              state: 'pending', context: process.env.CI_CONTEXT, description: '/ci run in progress',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/merge', github.event.issue.number) || '' }}
      - name: Set up R ${{ matrix.r-version }}
        uses: r-lib/actions/setup-r@f57f1301a053485946083d7a45022b278929a78a
        with:
          r-version: ${{ matrix.r-version }}
      - name: Install dependencies
        run: |
          install.packages(c("remotes", "rcmdcheck"))
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}
      - name: Check
        run: rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "error")
        shell: Rscript {0}

      - name: Report /ci run to the PR (result)
        if: always() && github.event_name == 'issue_comment' && env.CI_PR_HEAD_SHA != ''
        uses: actions/github-script@v7
        env:
          CI_CONTEXT: build (${{ join(matrix.*, ', ') }})
          CI_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const s = process.env.CI_JOB_STATUS;
            const state = s === 'success' ? 'success' : s === 'failure' ? 'failure' : 'error';
            await github.rest.repos.createCommitStatus({ ...context.repo, sha: process.env.CI_PR_HEAD_SHA,
              state, context: process.env.CI_CONTEXT, description: `/ci run: ${s}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
